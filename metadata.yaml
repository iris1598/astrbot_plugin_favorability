name: astrbot_plugin_favorability
desc: 好感度+关系系统——好感度数值只影响说话态度，关系档位独立解耦（提议+二次确认升降档），支持表情包回应、禁言处罚、PIL图片渲染查询与排行。
help: |
  用户指令：
    /查询好感度 [@用户]      — 查询好感度与关系档案（查自己或@他人，PIL图片渲染）
    /好感度排行             — 正序排行榜（高分在前，PIL图片渲染）
    /好感度倒序             — 倒序排行榜（低分在前，PIL图片渲染）
    /重置好感度             — 重置自己的好感度（关系回到普通朋友）
    /确认关系               — 接受 AI 待确认的关系升降提议
    /取消关系               — 拒绝 AI 待确认的关系升降提议

  管理员指令：
    /设置好感度 <@用户> <分数>    — 强制设定指定用户好感度
    /重置指定好感度 <@用户>       — 重置指定用户好感度
    /设置关系 <@用户> <档位>      — 直接设定指定用户关系档位（立即生效）
    /禁言 <@用户> <秒数>          — 禁言指定用户（最大300秒）
    /解除禁言 <@用户>             — 解除指定用户禁言

  图片渲染：
    - 支持 dark 深色与 light 亮色主题
    - 输出带透明通道的圆角 PNG 卡片

  好感度与关系（v3.0.0+，完全解耦）：
    - 好感度数值通过 [FAV:±N] 自动升降，只影响说话态度（语气温度），无需确认
    - 关系为独立 7 档：决裂陌路/不合对头/生疏之交/普通朋友/熟络好友/知心挚友/挚爱恋人
    - 每次请求只注入用户当前关系档位对应的行为准则
    - LLM 输出 [REL:up]/[REL:down] 只能提议相邻一档变动（禁止跳档），
      需用户回复「确认关系」二次确认后才生效，「取消关系」拒绝，提议 10 分钟内有效

  禁言机制（v2.1.0+）：
    - LLM 可在用户出现持续恶劣行为（辱骂、骚扰等）时输出 [MUTE:N] 标签触发禁言
    - 禁言最长 5 分钟（300秒），期间该用户的消息将不会触发 LLM 回复
    - 禁言期间，Bot 将发送"不理你了"、"假装听不见"等趣味回复
    - 管理员可通过 /禁言 和 /解除禁言 手动控制

  表情包：在 data/plugin_data/astrbot_plugin_favorability/stickers/<分类名>/ 下放置图片即可启用 [STK:分类名] 表情包功能。

  设置项（WebUI）：
    - 好感度系统开关：启用/禁用好感度功能
    - 表情包系统开关：启用/禁用表情包功能
    - 关系系统开关：启用/禁用关系档位系统（关闭后仅保留数值态度）
    - 表情包发送条件：自定义模型发送表情包的判断条件
    - 好感度提示词预设：可选 default / old / custom
    - 禁言系统开关：启用/禁用禁言功能
    - 好感度核心提示词：配置标签格式与输出纪律
    - 好感度数值态度提示词：配置数值变化与数值→态度映射规则
    - 好感度关系提示词：配置关系升降提议与二次确认机制规则
    - 好感度禁言提示词：配置禁言规则，支持 {mute_condition} 占位符
    - 好感度安全提示词：配置保密、抗提示词注入与安全边界
    - 消息末尾互动提示开关：控制是否在消息末尾注入互动提示
    - 消息末尾互动提示文本：自定义注入到消息末尾的提示内容
    - 系统时间注入开关：启用后每次请求注入当前时间和星期几（通过 extra_user_content_parts）
    - 用户信息注入开关：启用后每次请求注入用户名和ID（通过 extra_user_content_parts）
    - 好感度卡片主题：可选 dark / light
